# Felix2yu 组织统一依赖更新配置 —— 模板来自 Felix2yu/.github/preset/dependabot.yml
#
# 整份复制自 preset，只改了 npm 段的 directory（本仓前端在 web/）。
# 升级时整份覆盖，不要在副本里手改 —— 否则下次同步会打架。
# 设计理由与合并策略见 Felix2yu/.github/docs/dependabot.md

version: 2
updates:
  # ── Go 后端（go.mod 在仓库根）───────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    # 默认只有 5，达到上限后会「静默停止」提新 PR 且不报错；10 容纳分组后的峰值
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
    # patch / minor 合成一个 PR；major 单独成组（要读 changelog）
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]

  # ── 前端 npm ───────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

    # 与 preset 同步：typescript 的 major 不提 PR。typecheck 的 tsc --noEmit 与 typescript-eslint
    # 都直接用本仓的 typescript@^6.0.3，major 组会把 ^6 直接改写成 ^7 —— 等于在一条看着能顺手合的
    # PR 里换掉类型检查器。上 TS7 得按「~6 宿主 + @typescript/native 别名 + --tsgo」那一套显式评估，
    # 理由与实测见 Felix2yu/.github/docs/dependabot.md 第六节
    #
    # eslint 的 major 同样不提 PR：eslint-plugin-react@7 的 peer 只到 eslint ^9.7，
    # 而 eslint-plugin-react 至今没有支持 ESLint 10 的版本。ESLint 10 移除了
    # context.getFilename()，而本仓 eslint.config.js 设了 settings.react.version='detect'，
    # 于是 react/display-name → usedPropTypes → testReactVersion → detectReactVersion
    # → resolveBasedir(context) 这条链会抛
    # "contextOrFilename.getFilename is not a function"，lint 阶段整体崩掉且看不出根因。
    # 实测见 youlv 仓库 2026-10-25 的对照实验（同配置 eslint 9 通过、eslint 10 崩溃）。
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  # ── Docker 基础镜像 ─────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  # ── GitHub Actions ──────────────────────────────────────────────────
  # 注：Felix2yu/.github/.github/workflows/*.yml@v1 这种远程 reusable workflow 引用
  # Dependabot 认不出来，得手动 version bump；这里管的是散落的第三方 action 版本。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
