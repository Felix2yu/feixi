name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  repository_dispatch:
    types: [base-image-updated]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      # go.mod 在仓库根，前端工程在 web/；产物由 frontend-stage-command
      # 摆进 //go:embed 的 internal/web/dist
      go-dir: .
      web-dir: web
      # lint 纳入 CI：本仓 `pnpm run lint` 已本地实测绿（prettier --check + eslint）。
      # 只有构建侧被验证过是不够的 —— typescript-eslint 对 TS 7 是加载期硬失败。
      web-lint-command: pnpm run lint
      frontend-stage-command: mkdir -p internal/web/dist && cp -R web/dist/. internal/web/dist/
      # ./... 是安全的：internal/web/dist 里提交了一个占位 .gitkeep，
      # 没构建前端时 //go:embed all:dist 也能解析通过（静态资源走 public/，构建时拷进 dist）。
      test-packages: ./...

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: .
      main-package: ./cmd/feixi
      binary-name: feixi
      image-name: ghcr.io/felix2yu/feixi
      web-dir: web
      # 前端产物落在 web/dist，由 stage command 摆进 //go:embed 的 internal/web/dist，
      # 静态资源随二进制进镜像
      frontend-stage-command: mkdir -p internal/web/dist && cp -R web/dist/. internal/web/dist/

  release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: Felix2yu/.github/.github/workflows/reusable-release.yml@v1
    with:
      go-dir: .
      main-package: ./cmd/feixi
      binary-name: feixi
      web-dir: web
      frontend-stage-command: mkdir -p internal/web/dist && cp -R web/dist/. internal/web/dist/
